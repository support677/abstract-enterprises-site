name: Hero videos
# Renders a kinetic hero video for every page (tools/hero-video), uploads to Cloudflare R2,
# then puts each video in its page. Triggered by editing tools/hero-video/RUN (shards, limit, only).
on:
  push:
    branches: [main]
    paths: ["tools/hero-video/RUN"]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"   # daily: new pages from the page factory get their videos
concurrency: { group: hero-videos, cancel-in-progress: false }
permissions: { contents: write }
env:
  R2_ACCOUNT: be07eae675c065c362fad90c1bb1ec33
  R2_BUCKET: aess-videos
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      limit: ${{ steps.p.outputs.limit }}
      only: ${{ steps.p.outputs.only }}
      force: ${{ steps.p.outputs.force }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/hero-video/RUN, sparse-checkout-cone-mode: false }
      - id: p
        run: |
          f=tools/hero-video/RUN
          n=$(grep -oP '^shards=\K\d+' $f || echo 20); l=$(grep -oP '^limit=\K\d+' $f || echo 0); o=$(grep -oP '^only=\K.*' $f || true); fz=$(grep -oP '^force=\K\d' $f || echo 0)
          [ "${{ github.event_name }}" = "schedule" ] && { n=2; l=0; o=""; fz=0; }
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> $GITHUB_OUTPUT
          echo "limit=$l" >> $GITHUB_OUTPUT; echo "only=$o" >> $GITHUB_OUTPUT; echo "force=$fz" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: { shard: "${{ fromJSON(needs.plan.outputs.shards) }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools
        run: |
          pip install -q numpy Pillow boto3 kokoro-onnx soundfile imageio-ffmpeg
          if ! command -v ffmpeg >/dev/null; then
            sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1
          command -v ffmpeg   # fail the shard here if there is still no ffmpeg
      - uses: actions/cache@v4
        with: { path: ~/kokoro, key: kokoro-v1.0 }
      - name: Voice model
        run: |
          mkdir -p ~/kokoro; cd ~/kokoro
          [ -f kokoro-v1.0.onnx ] || curl -sSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Render + upload
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          KOKORO_DIR: /home/runner/kokoro
          HV_ONLY: ${{ needs.plan.outputs.only }}
          HV_WORKERS: "4"
          HV_FORCE: ${{ needs.plan.outputs.force }}
        run: python tools/hero-video/batch.py ${{ matrix.shard }} ${{ strategy.job-total }} ${{ needs.plan.outputs.limit }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-${{ matrix.shard }}", path: tools/hero-video/results/, if-no-files-found: ignore }
  inject:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: "results-*", path: results/now, merge-multiple: true }
      - name: Earlier run's results (only=@redo.txt reuses a finished run's videos)
        if: ${{ hashFiles('tools/hero-video/PREV_RUN') != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: "results-*"
          path: results/prev
          merge-multiple: true
          run-id: 42151143779
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Put videos in pages and push
        run: |
          git config user.name "aess-hero-videos"; git config user.email "support@abstractenterprisessecuritysystems.com"
          # Re-apply on top of the newest main each try, so pages the factory pushes meanwhile never conflict
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            for d in results/prev results/now; do [ -d $d ] && HV_DATE=$(date +%F) python3 tools/hero-video/inject.py $d; done
            git add -A '*.html'; git diff --cached --quiet && { echo "nothing to inject"; exit 0; }
            git commit -qm "Hero videos: $(git diff --cached --name-only | wc -l) pages"
            git push -q origin HEAD:main && { echo pushed; exit 0; }
            sleep 15
          done
          exit 1
