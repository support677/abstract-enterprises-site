<!doctype html>

<title>How-To Videos | Abstract Enterprises Security Systems</title>
<style>
  :root{--navy:#091638;--blue:#1B4AD6;--sky:#78A0FF}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:30px;font-weight:900;text-transform:uppercase;margin:8px 0 4px}
  h2{font-size:18px;color:var(--sky);text-transform:uppercase;letter-spacing:.05em;margin:28px 0 10px}
  p{color:#c9d3ec;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card{display:block;background:#0f1f4d;border-radius:14px;overflow:hidden;color:#fff;text-decoration:none}
  .card img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
  .card span{display:block;padding:10px 12px;font-weight:800;font-size:14px}
</style>
</head>

<main>
  <h1>How-to videos</h1>

  <h2>Cameras</h2>

    <a class="card" href="/how-to/cameras-new-phone/"><img src="/how-to/cameras-new-phone/poster.jpg" alt=""><span>New phone? Get your cameras back</span></a>
